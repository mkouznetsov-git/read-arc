name: ReadArc verified pipeline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      default_relay_url:
        description: 'Optional relay URL; defaults to the official ReadArc relay'
        required: false
        default: ''
      build_debug_artifacts:
        description: 'Also build debug artifacts'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      publish_release:
        description: 'Publish a GitHub Release after every verification job passes'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      release_tag:
        description: 'Manual release tag; empty means main-latest'
        required: false
        default: ''
      release_prerelease:
        description: 'Mark a manual release as prerelease'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: readarc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.0'
  RUST_VERSION: '1.98.0'
  CARGO_NDK_VERSION: '4.1.2'
  READARC_DEFAULT_RELAY_URL: ${{ github.event.inputs.default_relay_url || vars.READARC_DEFAULT_RELAY_URL || 'https://relay.readarc.ru' }}
  READARC_BASE_VERSION: '0.49.1'
  READARC_BUILD_NUMBER: ${{ github.run_number }}
  BUILD_DEBUG_ARTIFACTS: ${{ github.event.inputs.build_debug_artifacts || 'false' }}

jobs:
  quality:
    name: Unit, regression and static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install pinned relay test dependencies
        run: python3 -m pip install --disable-pip-version-check -r server/rendezvous_relay/requirements-test.txt

      - name: Run strict quality gate
        run: bash ./scripts/quality_gate.sh

      - name: Capture formatter diff
        if: failure()
        run: |
          dart format apps/flutter_client/lib apps/flutter_client/test apps/flutter_client/integration_test
          git diff -- apps/flutter_client/lib apps/flutter_client/test apps/flutter_client/integration_test > test-results/dart-format.patch
      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-gate-logs
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14

  android-smoke:
    name: Android emulator smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate Android project
        env:
          READARC_PLATFORMS: android
        run: bash ./scripts/prepare_flutter_platforms.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android application smoke test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            bash -lc 'set -o pipefail; mkdir -p test-results; cd apps/flutter_client; flutter test integration_test/app_smoke_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee ../../test-results/android-smoke.log'

      - name: Upload Android smoke logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-smoke-logs
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14

  macos-smoke:
    name: macOS application smoke test
    runs-on: macos-15
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate macOS project
        env:
          READARC_PLATFORMS: macos
        run: bash ./scripts/prepare_flutter_platforms.sh

      - name: Run macOS application smoke test
        run: |
          set -o pipefail
          mkdir -p test-results
          cd apps/flutter_client
          flutter test integration_test/app_smoke_test.dart -d macos --reporter expanded 2>&1 | tee ../../test-results/macos-smoke.log

      - name: Upload macOS smoke logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-smoke-logs
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14

  ios-build-smoke:
    name: iOS unsigned build smoke test
    runs-on: macos-15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate iOS project
        env:
          READARC_PLATFORMS: ios
        run: bash ./scripts/prepare_flutter_platforms.sh

      - name: Build iOS without signing
        working-directory: apps/flutter_client
        run: |
          set -euo pipefail
          build_name="$READARC_BASE_VERSION"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then build_name="${GITHUB_REF_NAME#v}"; fi
          flutter build ios --release --no-codesign \
            --build-name "$build_name" \
            --build-number "$READARC_BUILD_NUMBER" \
            --dart-define="READARC_DEFAULT_RELAY_URL=$READARC_DEFAULT_RELAY_URL" \
            --dart-define="READARC_BUILD_NAME=$build_name" \
            --dart-define="READARC_BUILD_NUMBER=$READARC_BUILD_NUMBER"

  android-package:
    name: Verified Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [android-smoke, macos-smoke, ios-build-smoke]
    env:
      READARC_REQUIRE_RELEASE_SIGNING: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
      READARC_REQUIRE_NATIVE_ENGINES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust 1.98.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install pinned Android native build helper
        run: cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: Download previous production universal APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-release
          gh release download main-latest \
            --pattern '*-android-*-release.apk' \
            --dir previous-release
          mapfile -t previous_apks < <(find previous-release -maxdepth 1 -type f -name '*-android-universal-release.apk')
          if [[ ${#previous_apks[@]} -ne 1 ]]; then
            echo "ERROR: expected exactly one previous production universal APK, found ${#previous_apks[@]}." >&2
            exit 1
          fi

      - name: Configure ephemeral Android signing for pull-request verification
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore apps/flutter_client/android/app/readarc-ci.jks \
            -storepass readarc-ci-only \
            -keypass readarc-ci-only \
            -alias readarc-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=ReadArc CI package verification'
          {
            echo 'storeFile=readarc-ci.jks'
            echo 'storePassword=readarc-ci-only'
            echo 'keyAlias=readarc-ci'
            echo 'keyPassword=readarc-ci-only'
          } > apps/flutter_client/android/key.properties

      - name: Configure protected Android signing
        if: env.READARC_REQUIRE_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: required Android release signing secret is missing: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > apps/flutter_client/android/app/readarc-release.jks
          {
            echo 'storeFile=readarc-release.jks'
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > apps/flutter_client/android/key.properties

      - name: Build Android packages
        run: bash ./scripts/package_android.sh

      - name: Enable KVM for packaged APK upgrade test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run packaged Android adb install -r upgrade test
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          READARC_RESIGN_UPGRADE_FIXTURES: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run_android_upgrade_smoke_ci.sh

      - name: Upload packaged Android verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-package-verification-logs
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReadArc-android-release
          path: dist/android/*
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: Verified macOS packages
    runs-on: macos-15
    timeout-minutes: 45
    needs: [android-smoke, macos-smoke, ios-build-smoke]
    env:
      READARC_REQUIRE_NATIVE_ENGINES: 'true'
      READARC_REQUIRE_STABLE_MACOS_SIGNING: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter 3.47.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Rust 1.98.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Configure stable macOS signing when available
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            if [[ "$READARC_REQUIRE_STABLE_MACOS_SIGNING" == "true" ]]; then
              echo 'ERROR: protected macOS signing certificate is required for production packaging.' >&2
              exit 1
            fi
            echo 'PR/internal build: protected signing certificate unavailable; using documented ad-hoc mode.'
            exit 0
          fi
          for name in MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: incomplete macOS signing configuration: $name" >&2
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/readarc-signing.keychain-db"
          certificate="$RUNNER_TEMP/readarc-signing.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"
          echo "READARC_MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "READARC_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build macOS packages
        run: bash ./scripts/package_macos.sh

      - name: Remove temporary macOS signing keychain
        if: always() && env.READARC_MACOS_KEYCHAIN != ''
        run: security delete-keychain "$READARC_MACOS_KEYCHAIN"

      - name: Run packaged macOS clean and legacy-library upgrade test
        run: |
          set -euo pipefail
          mkdir -p test-results
          app_zip="$(find dist/macos -maxdepth 1 -type f -name '*-macos-release-app.zip' -print -quit)"
          [[ -n "$app_zip" ]]
          [[ "$(find dist/macos -maxdepth 1 -type f -name '*-macos-release-app.zip' | wc -l | tr -d ' ')" == 1 ]]
          bash scripts/macos_package_upgrade_smoke.sh "$app_zip" test-results/macos-package-upgrade-smoke.txt

      - name: Upload packaged macOS verification logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-package-verification-logs
          path: test-results/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload macOS packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ReadArc-macos-release
          path: dist/macos/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish verified GitHub Release
    runs-on: ubuntu-24.04
    needs: [android-package, macos-package]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download Android packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ReadArc-android-release
          path: release-assets/android

      - name: Download macOS packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ReadArc-macos-release
          path: release-assets/macos

      - name: Select release channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=ReadArc $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "title=ReadArc ${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.inputs.release_prerelease }}" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            echo 'tag=main-latest' >> "$GITHUB_OUTPUT"
            echo 'title=ReadArc main-latest' >> "$GITHUB_OUTPUT"
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
            echo 'rolling=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          mv release-assets/android/SHA256SUMS release-assets/android/ReadArc-android-SHA256SUMS.txt
          mv release-assets/macos/SHA256SUMS release-assets/macos/ReadArc-macos-SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<EOF
          # ${{ steps.channel.outputs.title }}

          Эта сборка опубликована только после успешных unit/regression/static checks, Android emulator smoke, реального Android `adb install -r` package upgrade с проверкой сохранности данных, macOS application smoke, запуска упакованного ad-hoc `.app` на чистых и legacy-данных и iOS unsigned build smoke.

          - Commit: \`${GITHUB_SHA}\`
          - Build: \`${GITHUB_RUN_NUMBER}\`
          - Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Android-артефакты подписаны закрытым release key из GitHub Secrets. Публикуемые macOS-пакеты проходят обязательную стабильную Developer ID подпись; PR artifacts явно маркируются как ad-hoc. iOS проверяется сборкой без подписи и не публикуется как installable IPA.
          EOF
          find release-assets -type f -print | sort

      - name: Move rolling release tag
        if: steps.channel.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f main-latest "$GITHUB_SHA"
          git push --force origin refs/tags/main-latest

      - name: Publish clean ReadArc release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.channel.outputs.tag }}
          TITLE: ${{ steps.channel.outputs.title }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f -print | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'ERROR: no verified release assets were downloaded.' >&2
            exit 1
          fi
          prerelease_flags=()
          if [[ "$PRERELEASE" == true ]]; then prerelease_flags+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            mapfile -t old_assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in "${old_assets[@]:-}"; do
              [[ -n "$asset" ]] && gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md "${prerelease_flags[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes-file RELEASE_NOTES.md "${prerelease_flags[@]}"
          fi

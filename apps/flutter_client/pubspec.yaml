name: readarc
description: Local-first cross-platform reader for ReadArc.
publish_to: 'none'
version: 0.49.1+42

environment:
  sdk: '>=3.13.0 <3.14.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.7
  cryptography: 2.9.0
  file_picker: 10.3.10
  path: 1.9.1
  path_provider: 2.1.6
  uuid: 4.6.0
  web_socket_channel: 3.0.3
  qr_flutter: 4.1.0
  qr_code_scanner_plus: 2.2.0
  pdfx: 2.11.0
  url_launcher: 6.3.2
  archive: 3.6.1
  ffi: 2.2.0
  image: 4.3.0
  flutter_secure_storage: 10.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/readarc_icon_128.png
    - assets/brand/readarc_icon_1024.png
